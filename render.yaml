services:
  - type: web
    name: studiospace-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_DB_NAME
        value: studiospace
      - key: MONGODB_URI
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://thestudiospace.vercel.app
      - key: FRONTEND_URL
        value: https://thestudiospace.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

